# CP-51A 法定程序台账（legal & filing procedures ledger）
# 来源：蓝图 §5.1 法律与申报矩阵（12 项）。契约测试：
# src/test/java/com/innercosmos/regulatory/RegulatoryLedgerContractTest.java
#
# 诚实规则（结构性强制）：
# - status ∈ {PENDING, IN_PROGRESS} —— coding agent 只能推进结构；"已履行法定程序"
#   只能由 operator 以外部回执/签字在 evidence/ 落位后回填 receipt/signature 字段
# - 程序终态分别记录：经营许可=许可生效；备案/登记=完成状态与公示；安全评估=评估、
#   报送与属地要求履行；商店=具体制品与功能的审核结果。**不存在 APPROVED 状态**，
#   不为法律未设置审批的程序虚构"行政批准证书"，不把提交截图当程序完成
# - 51A 与 51B（商店提审）互不晋升：本台账通过不等于任何渠道提审通过

procedures:
  - procedure_id: telecom-operator
    matter: 运营主体与电信业务（B25 适用范围核定）
    applicable_judgment: 域名、组织开发者、收款、应用名称、代码资产一致后按实际信息社区/收费服务核定 B25 等适用范围；备案不等于经营许可
    required_state: 签字适用意见；需取得的许可未取得则阻断对应业务
    depends_on: CP-05, CP-51
    allowed_scope: 适用意见签字前不开展社区/收费电信业务，仅可进行产品研发与非公开测试
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: app-icp-filing
    matter: 网站/APP 备案
    applicable_judgment: 新 APP 先履行备案再开展业务；网页、域名、APP 包名和签名对应，展示核验信息；公开 APK 不是豁免
    required_state: 真实回执与线上展示匹配
    depends_on: CP-51
    allowed_scope: 备案完成前不开通对应域名/APP 业务
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: genai-safety-assessment
    matter: 生成式 AI 服务安全评估与算法备案（2023-08-15 施行）
    applicable_judgment: 按公众生成服务的实际舆论/社会动员属性核验；供应商资格不替代应用义务
    required_state: 逐功能路线明确；评估/备案按适用完成（据本行适用判断列补全）
    depends_on: CP-06, CP-17
    allowed_scope: 评估报送期间按属地要求限制功能开放
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: registered-model-app-registration
    matter: 已备案模型的应用登记（2026-01-09 公告）
    applicable_judgment: 直接调用已备案模型的应用/功能由地方网信办登记；记录具体模型、服务名称与调用链，不仅记品牌
    required_state: 供应商证据 + 本应用适用程序/公示
    depends_on: CP-06
    allowed_scope: 登记完成前不宣称"已登记"
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: anthropomorphic-safety-filing
    matter: 拟人化互动安全评估与备案（2026-07-15 施行）
    applicable_judgment: Aurora 持续情感互动高度符合适用描述；上线/新增拟人化功能即列入安全评估触发情形；100万注册/10万MAU 不是首发豁免线
    required_state: 向省级网信部门提交评估报告并跟进属地要求与整改；不把提交等同批准；年度核验
    depends_on: CP-06, CP-08, CP-20, CP-51
    allowed_scope: S2 获准 = 满足适用法定程序后由产品所有者依法批准该范围试点（法务签字不能替代法定程序）
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: social-info-service-assessment
    matter: 社交信息服务安全评估（广场/群组）
    applicable_judgment: 广场、群组等另核验具有舆论属性或社会动员能力的信息服务评估路径，不以 AI 评估替代
    required_state: 逐功能适用判断与真实材料
    depends_on: CP-06, CP-36, CP-51
    allowed_scope: 未完成评估前社交面保持受邀/受限
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: personal-info-protection
    matter: 个人信息与敏感信息处理合规
    applicable_judgment: 分目的记录对话、声音、健康/心理相关推断、身份、关系、支付与风险信息；敏感、对外提供、自动化决策、跨境等完成适用评估与同意，不捆绑公开和训练
    required_state: 影响评估、数据权利、抓包与权限负测证据
    depends_on: CP-07, CP-14, CP-15
    allowed_scope: 同意版本服务端核验通过后才可调用真实 Provider
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: data-audit-classification
    matter: 数据审计与网络安全等级保护
    applicable_judgment: 定级基于系统边界与损害影响，不能默认"买云即等保三级"；云厂商资质不覆盖应用
    required_state: 专业意见和可核验证据；按适用要求备案、测评、定期审计与事件响应
    depends_on: CP-16, CP-37, CP-63
    allowed_scope: 测评完成前不宣称等保等级
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: ai-content-labeling
    matter: AI 生成合成标识（2025-09-01 施行）
    applicable_judgment: 生成与传播两侧均纳入：显式提示、文件隐式标识、导出/复制/上传声明；共鸣体不能冒充本人
    required_state: 各媒体与分享链标识验证证据
    depends_on: CP-08, CP-27, CP-31
    allowed_scope: 标识验证未过的媒体不开放分享
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: minor-protection-antifraud
    matter: 未成年人保护、反诈与网暴治理
    applicable_judgment: 成人定位仍需有效年龄识别、误入处置与申诉；后台身份核验与前台化名分离；好友私聊不免审核治理责任
    required_state: 真实值班与处置演练记录（值班演练落位于 CP-48 台账，非蓝图本行工作包）
    depends_on: CP-08, CP-13, CP-32, CP-33, CP-34, CP-35, CP-36
    allowed_scope: 年龄闸门与申诉路径可用后才开放注册
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: consumer-auto-renewal
    matter: 消费者权益与自动续费规范
    applicable_judgment: 定价、权益、配额、续费、取消、退款和发票有真实流程；续费前显著提醒；不做可提现代币与用户资金托管
    required_state: 真实交易与对账通过；续费提醒排程上线（本行适用判断列"续费前显著提醒"的操作化落位）
    depends_on: CP-45, CP-46, CP-47, CP-48
    allowed_scope: 小额验收交易样本前不开通自动续费
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
  - procedure_id: non-medical-boundary
    matter: 非医疗支持边界
    applicable_judgment: 不作诊断、处方、疗效或危机救援承诺；免责声明不能覆盖实际诊疗行为
    required_state: 专家评审记录与现实支持路径
    depends_on: CP-20, CP-28, CP-60
    allowed_scope: 专业服务另立项，不在本产品内提供
    status: PENDING
    receipt: null
    signature: null
    open_remediation: null
