# CP-43/44 提审材料清单骨架 — Apple 中国区

结构化骨架：status 只允许 PENDING | IN_PROGRESS | WAIVED(需 approved_by)；
不存在 PASS 状态——审批通过必须以 evidence 中的官方回执为准，由 operator 填入。

items:
  - id: org-account
    category: 渠道基础
    requirement: 组织开发者账户与 DUNS 就绪
    evidence_required: 账户回执
    blocks_submission: True
    status: PENDING
    evidence: null
    approved_by: null
  - id: icp-metadata
    category: 渠道基础
    requirement: App 备案信息写入 App Store Connect 元数据
