    status: PENDING
    evidence: null
    approved_by: null
  - id: privacy-manifest
    category: 隐私
    requirement: 隐私清单与 SDK 数据声明（含第三方 AI 接收方/目的/方式）
    evidence_required: 隐私清单文件
    blocks_submission: True
    status: PENDING
    evidence: null
    approved_by: null
  - id: age-rating
    category: 合规
    requirement: 年龄分级与 17+ 策略核对
