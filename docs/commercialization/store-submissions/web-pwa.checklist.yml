# CP-43/44 提审材料清单骨架 — 大陆 Web／PWA

结构化骨架：status 只允许 PENDING | IN_PROGRESS | WAIVED(需 approved_by)；
不存在 PASS 状态——审批通过必须以 evidence 中的官方回执为准，由 operator 填入。

items:
  - id: domain-icp
    category: 渠道基础
    requirement: 域名备案与接入商手续完成，备案号展示
    evidence_required: 备案回执
    blocks_submission: True
    status: PENDING
    evidence: null
    approved_by: null
  - id: https-cert
    category: 渠道基础
    requirement: 全站 HTTPS 证书与更新机制
    evidence_required: 证书监控截图
    blocks_submission: True
    status: PENDING
    evidence: null
    approved_by: null
  - id: download-parity
    category: 发布完整性
    requirement: 下载页与实际分发包 SHA 一致
    evidence_required: SHA 对照记录
    blocks_submission: True
    status: PENDING
    evidence: null
    approved_by: null
  - id: account-flows
    category: 账号流程
    requirement: 注册/登录/注销/导出/删除在 Web 端完整
    evidence_required: J01/J09 演示记录
    blocks_submission: True
    status: PENDING
    evidence: null
    approved_by: null
  - id: payment-permit
    category: 支付
    requirement: 支付接入依业务许可范围（未上线前标记不启用）
    evidence_required: 法务意见
    blocks_submission: False
    status: PENDING
    evidence: null
    approved_by: null
  - id: seo-public-only
    category: 内容
    requirement: SEO 只含公开获准内容，无私人数据
    evidence_required: 抓取审计
    blocks_submission: False
    status: PENDING
    evidence: null
    approved_by: null
  - id: pwa-update
    category: 发布完整性
    requirement: Service Worker 更新与旧 bundle/新 API 兼容策略
    evidence_required: 升级中断测试记录
    blocks_submission: False
    status: PENDING
    evidence: null
    approved_by: null
