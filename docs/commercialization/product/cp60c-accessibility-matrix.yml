# CP-60C 可达性矩阵（accessibility matrix：J01–J12 × 五端 × 四维度）
# 来源：蓝图 §7 CP-60 / §8 子门 CP-60C（"完整辅助技术／弱网／跨端J01–J12矩阵"，
# 依赖 CP-60A、CP-60B 及各声明支持端）；旅程名称照蓝图 §3.2 L115–L130。
# 契约测试：src/test/java/com/innercosmos/product/AccessibilityMatrixContractTest.java
#
# 诚实规则（结构性强制，照 legal-procedures.ledger.yml 范本）：
# - status ∈ {NOT_STARTED, AUTOMATED_PASS, MANUAL_PENDING}：
#     NOT_STARTED   尚未开始（未带证据推进前的默认诚实状态）
#     AUTOMATED_PASS 仅当对应自动化可达性检查真实通过，且同维度 *_evidence
#                   必须落位指向可复现实证（CI 作业/报告路径），否则契约测试拒绝
#     MANUAL_PENDING 辅助技术人工测试（读屏/键盘真实设备操作）已排期或进行中，
#                   完成证据同样只能由 operator 以外部回执落位
# - **没有任何"完成/done/passed"汇总字段**：一格一个状态，人工与自动证据分开记录，
#   不以自动化通过冒充人工辅助技术验证，不以单端通过冒充五端通过
# - 某平台未满足则该平台对应单元格保持真实状态，不得宣称"完全体多端完成"（CP-60 恢复条款）
# - 行（journey_id）与蓝图 §3.2 的 J01–J12 一一对应；新增端或维度须同步改契约测试
#
# 2026-09-15 首批推进（CP-60C §2-26，证据优先）：web×keyboard（J01/J02/J05）与
# web×contrast（J02/J04）共 5 格按既有自动化合同测试推进 AUTOMATED_PASS；每格 evidence
# 引用 web/src 下真实存在的测试文件与用例名。其余 235 格保持 NOT_STARTED——它们没有
# 既有自动化证据，不因同列其他格通过而冒进。

