# CP-53/CP-55 增长与定价实验注册表（pre-registered experiment registry）
# 契约测试：src/test/java/com/innercosmos/experiments/ExperimentRegistryContractTest.java
#
# 诚实规则（结构性强制）：
# - 预注册块（hypothesis/randomization_unit/primary_endpoint/decision_band/stopping_gates/
#   budget_cap/sample_size/statistical_method）在 status>=PREREGISTERED 后必须已冻结——
#   frozen_at 由 operator 签字落位（owner_signature 同理），coding agent 永远只能写 DRAFT
# - 主终点只能是 CP-03 指标字典的 K1/K2/K3；时长、DAU、消息数、生成记忆数、发信数、
#   流水额是诊断指标，禁止作主终点
# - conclusion 只能由 reviewer 凭证据回填——跑完实验≠假设成立（EVALUATION_EXECUTED 与
#   CAPABILITY_ACCEPTED 分离的同一纪律）
# - variables_changed 上限 2 是严于蓝图（蓝图仅说"少量"）的内部政策，在契约测试中注明

schema_version: 1
ledger_id: COMMERCIAL-EXPERIMENT-REGISTRY-2026-09
authority:
  blueprint: docs/commercialization/01-中国大陆商业化执行蓝图.md
  metric_dictionary: docs/commercialization/ledger/metric-dictionary.md

experiments:
  - experiment_id: growth-channel-001
    kind: growth_channel
    owner: 品牌＋增长＋内容审核
    reviewer: 创始人
    stage: S2
    channel: 小红书（成人自我探索议题内容）
    hypothesis: 通过成人自我探索议题的真实内容触达的目标用户，其 D30 窗口价值留存不低于 15% 决策带下限
    randomization_unit: user
    primary_endpoint: K2_d30_window_value_retention
    secondary_endpoints: K1_weekly_confirmed_value, K3_monthly_contribution_margin
    gate_metrics: G-SAFE, G-TRUST
    minimum_meaningful_difference: K2 +3pp versus 自然流量对照
    decision_band_pause_below: "0.15"
    decision_band_further_validation_at: "0.25"
    stopping_gates: 预算耗尽, G-SAFE/G-TRUST 严重事件立即停, 决策带下限两次核心改版无改善, 月度安全审查不通过
    statistical_method: 两个独立二项比例的95%置信区间比较；0/N 用近似独立二项上界≈3/N；按用户聚类的稳健标准误
    sample_size_exploratory_n: "60"
    sample_size_power_target_n: null
    budget_cap_amount: "5000"
    budget_cap_currency: CNY
    budget_cap_period: 单实验全程
    subsidy_cap: "1000"
    subsidy_counts_into_cac: "true"
    natural_retention_reported_separately: "true"
    variables_changed: 渠道内容主题, 落地页价值主张
    community_permission_obtained: "false"
    community_permission_evidence: null
    funnel: reach, compliant_visit, activation, d30_window_value_retention, payment_or_refund
    cac_cost_components: labor, subsidy, creator_fees
    status: DRAFT
    frozen_at: null
    owner_signature: null
    first_enrolled_at: null
    conclusion: null
    forbidden_practices_note: 不购买水军、不制造虚假热度、合成示例永久标 AI、不以分享换数据权利、不上传通讯录、不自动群发
