# CP-63 复核日历（review calendar ledger）
# 来源：蓝图 CP-63（独立安全、隐私与监管复核）——"形成季度内部审计、模型变更检查、
# 监管年度事项和真实事件触发复核日历"；每法律与商店证据有 owner、适用功能、依据、
# 生效日、核验日、回执和重验时间。契约测试：
# src/test/java/com/innercosmos/security/ReviewCalendarContractTest.java
#
# 诚实规则（结构性强制）：
# - status ∈ {PENDING, IN_PROGRESS, REMEDIATION_REQUIRED}——不存在 agent 可写的
#   VERIFIED/PASSED 终态。独立复核的"核验事实"只能由 operator 以外部回执落位后回填
#   last_verified_at 与 receipt（本文件当前全部为 null：尚无任何独立核验事实）
# - 超过法定或内部有效期不能自动沿用旧 PASS：有效期引擎（契约测试中的
#   effectiveStatus）判定 last_verified_at 非空且评估日晚于 revalidate_due_at 的条目为
#   EXPIRED；EXPIRED 条目阻断对应 CP 的复核通过宣称，必须重新核验或整改复验
# - 63A 与 63B 互不覆盖（蓝图子门）：63A 条目只登记 S3 首发基线暴露面，不等待 S5
#   新增功能；63B 条目的 scope 必须显式覆盖 CP-57/58/59/60 新增暴露面，且不得与 63A
#   条目共用 scope 描述——不得用 63A 结论覆盖 63B 暴露面
# - 日历驱动条目（QUARTERLY_INTERNAL_AUDIT / REGULATORY_ANNUAL）必须登记
#   revalidate_due_at（法定或内部有效期到期日）；事件驱动条目
#   （MODEL_CHANGE_CHECK / INCIDENT_TRIGGERED）按触发复核，不设日历期限
#   （revalidate_due_at: null）

reviews:
  # ---- 季度内部审计（QUARTERLY_INTERNAL_AUDIT）----
  - review_id: rc-qa-63a-boundary
    kind: QUARTERLY_INTERNAL_AUDIT
    scope: CP-63A·CP-14/15/16：P0–P3 读路径授权、数据资产清单与撤回／缓存复活的季度内部审计（S3 首发基线，不含 S5 新增能力）
    owner: 安全负责人＋外部安全／隐私专业方
    effective_from: "2026-09-06"
    last_verified_at: null
    revalidate_due_at: "2026-12-06"
    status: IN_PROGRESS
    receipt: null
    evidence_path: null
