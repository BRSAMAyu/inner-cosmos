# Compatibility entrypoint for operators who run `docker compose` from the
# repository root. The maintained full-stack definition lives under
# deploy/compose; keep one source of truth rather than a second, drifting
# MySQL-based production model.
#
# Required provider and OIDC values remain external. For generated local
# database/Redis secrets and prerequisite validation, prefer:
#   .\scripts\local-complete.ps1 -Action Up
include:
  - path: deploy/compose/local-complete.yml
