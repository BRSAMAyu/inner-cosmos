name: inner-cosmos-public-demo

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: inner_cosmos
      POSTGRES_USER: inner_cosmos
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?generated by run-public-demo.ps1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inner_cosmos -d inner_cosmos"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - public-demo-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?generated by run-public-demo.ps1}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - public-demo-redis:/data
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: inner-cosmos:public-demo
    environment:
      SPRING_PROFILES_ACTIVE: mobile-local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inner_cosmos
      SPRING_DATASOURCE_USERNAME: inner_cosmos
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SESSION_ENABLED: "true"
      # Keep the same distributed abuse controls as the formal product. Classroom capacity is
      # expressed through explicit, bounded quotas instead of bypassing the filter.
      REDIS_RATE_LIMIT_ENABLED: "true"
      DEMO_UNLIMITED_USAGE_ENABLED: "false"
      RATE_LIMIT_LOGIN_CAPACITY: "120"
      RATE_LIMIT_LOGIN_REFILL_PER_MINUTE: "120"
      RATE_LIMIT_LOGIN_ADVERTISED: "120"
      RATE_LIMIT_ANON_CAPACITY: "240"
      RATE_LIMIT_ANON_REFILL_PER_MINUTE: "240"
      RATE_LIMIT_ANON_ADVERTISED: "240"
      RATE_LIMIT_USER_CAPACITY: "120"
      RATE_LIMIT_USER_REFILL_PER_MINUTE: "120"
      RATE_LIMIT_USER_ADVERTISED: "120"
      RATE_LIMIT_AURORA_CAPACITY: "30"
      RATE_LIMIT_AURORA_REFILL_PER_MINUTE: "30"
      RATE_LIMIT_AURORA_ADVERTISED: "30"
      RATE_LIMIT_MODEL_BACKED_CAPACITY: "30"
      RATE_LIMIT_MODEL_BACKED_REFILL_PER_MINUTE: "30"
      RATE_LIMIT_MODEL_BACKED_ADVERTISED: "30"
      REDIS_SCHEDULER_LOCK_ENABLED: "true"
      REDIS_AURORA_STREAM_ENABLED: "true"
      REDIS_IDEMPOTENCY_ENABLED: "true"
      JDBC_OUTBOX_ENABLED: "true"
      OIDC_ENABLED: "false"
      LLM_MODE: dev
      LLM_PROVIDER: ${LLM_PROVIDER:?selected by run-public-demo.ps1}
      LLM_API_KEY: ${LLM_API_KEY:?loaded locally by run-public-demo.ps1}
      LLM_REAL_PROVIDER_FAILOVER_ENABLED: "true"
      LLM_FAILOVER_PROVIDERS: ${LLM_FAILOVER_PROVIDERS:-gemini,deepseek,minimax,glm,mimo}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GLM_API_KEY: ${GLM_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      ASR_PROVIDER: ${ASR_PROVIDER:-mimo}
      AURORA_FAST_MODEL: ${AURORA_FAST_MODEL:-gemini-3.6-flash}
      AURORA_SPEAKER_MODEL: ${AURORA_SPEAKER_MODEL:-gemini-3.6-flash}
      AURORA_THINKER_MODEL: ${AURORA_THINKER_MODEL:-gemini-3.6-flash}
      AURORA_SPEAKER_THINKING_LEVEL: ${AURORA_SPEAKER_THINKING_LEVEL:-minimal}
      AURORA_SPEAKER_MAX_TOKENS: ${AURORA_SPEAKER_MAX_TOKENS:-2048}
      LLM_ALLOW_FALLBACK: "false"
      INNER_COSMOS_AURORA_PROACTIVE_JOB_ENABLED: "false"
      # Simple first-meeting turns use the measured single-pass path; memory-heavy, ambiguous,
      # interrupted and safety-sensitive turns retain the planner -> speaker path. This is the
      # classroom capacity profile, not a change to the product-wide dual-kernel default.
      AURORA_RUNTIME_MODE: adaptive
      # The classroom UI and seed journey default to English, while Aurora follows the language
      # used in the current user input. The provider boundary still overrides legacy prompts that
      # hard-code Chinese output.
      LLM_PROMPT_LANGUAGE: auto
      # Formal semantic retrieval is on by default. The runbook offers an explicit recovery switch
      # for provider incidents, and records that degraded mode instead of silently changing product
      # semantics for every presentation.
      MEMORY_EMBEDDING_ENABLED: ${MEMORY_EMBEDDING_ENABLED:-true}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:?loaded locally by run-public-demo.ps1}
      TTS_ENABLED: "true"
      TTS_API_KEY: ${TTS_API_KEY:?loaded locally by run-public-demo.ps1}
      TTS_WS_URL: ${TTS_WS_URL}
      CORS_ALLOWED_ORIGINS: https://localhost
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: none
      INNER_COSMOS_SECURITY_TRUSTED_PROXY_ENABLED: "true"
      # The SPA refreshes its synchronizer token after every persona/session transition. Public
      # presentation traffic therefore keeps the formal CSRF boundary instead of weakening it.
      INNER_COSMOS_SECURITY_CSRF_ENABLED: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
      # Optional classroom bridge into the already-running kind OTel Collector. The host port is
      # loopback-only; the app container reaches it through Docker Desktop's host gateway.
      OTLP_TRACING_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://host.docker.internal:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.10}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-inner-cosmos-public-demo}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-classroom-public-demo}
      # Classroom-only lived-in personas. Public passwordless entry is limited to the three
      # non-admin SHOWCASE identities; the production profile still refuses this controller.
      SEED_ENABLED: "true"
      INNER_COSMOS_DEMO_SEED_ENABLED: "true"
      DEMO_PUBLIC_ENTRY_ENABLED: "true"
      DEMO_SEED_ADMIN_ENABLED: "false"
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped

volumes:
  public-demo-postgres:
  public-demo-redis:
