# kind-full: a real-Postgres + real-Redis, 3-role (api/worker/scheduler) local kind profile
# that uses the same real-provider Aurora path as the classroom Demo so the W3 hero-gate fault
# injections (pod delete mid-SSE-turn, outbox-driven autoscaling) exercise genuine
# cross-pod durable state instead of each pod's own isolated H2 file (kind-dev's profile).
# Known, disclosed boundary: no TLS and no password on the in-namespace Postgres/Redis,
# and no OIDC — this profile trades production security posture for a fast, reproducible
# local fault-injection ground per document 24 6.2 ("本地 kind 是三条高级能力的完整实验与
# 演示场"). It must never be pointed at real user data or exposed outside the cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inner-cosmos-config
data:
  INNER_COSMOS_EXPECTED_SCHEMA_VERSION: "34"
  INNER_COSMOS_AURORA_TURN_RECOVERY_GENERATION_LEASE_TTL: "PT15S"
  INNER_COSMOS_AURORA_TURN_RECOVERY_STALE_AFTER: "PT10S"
  INNER_COSMOS_AURORA_TURN_RECOVERY_POLL_DELAY_MS: "5000"
  # Deterministic fault-injection window for the local H1 showcase only. This does not fake
  # recovery; it keeps the real generation lease visible while the presenter targets its Pod.
  INNER_COSMOS_DEMO_H1_ARM_DELAY_MS: "5000"
  SPRING_PROFILES_ACTIVE: dev,postgres
  SPRING_DATASOURCE_URL: jdbc:postgresql://inner-cosmos-postgres:5432/inner_cosmos
  SPRING_DATASOURCE_USERNAME: inner_cosmos
  SPRING_FLYWAY_ENABLED: "false"
  REDIS_HOST: inner-cosmos-redis
  REDIS_PORT: "6379"
  REDIS_SESSION_ENABLED: "true"
  REDIS_IDEMPOTENCY_ENABLED: "true"
  # H1/H2/H3 are classroom experiments: do not turn normal exploration into 429s.
  REDIS_RATE_LIMIT_ENABLED: "false"
  DEMO_UNLIMITED_USAGE_ENABLED: "true"
  REDIS_AURORA_STREAM_ENABLED: "true"
  REDIS_SCHEDULER_LOCK_ENABLED: "true"
  REDIS_SESSION_NAMESPACE: inner-cosmos:w3:session
  REDIS_SCHEDULER_LOCK_NAMESPACE: inner-cosmos-w3-scheduler-v1
  JDBC_OUTBOX_ENABLED: "true"
  LLM_MODE: dev
  LLM_PROVIDER: gemini
  LLM_ALLOW_FALLBACK: "false"
  LLM_REAL_PROVIDER_FAILOVER_ENABLED: "true"
  LLM_FAILOVER_PROVIDERS: gemini,deepseek,minimax,glm,mimo
  GEMINI_MODEL: gemini-3.6-flash
  AURORA_FAST_MODEL: gemini-3.6-flash
  AURORA_SPEAKER_MODEL: gemini-3.6-flash
  AURORA_THINKER_MODEL: gemini-3.6-flash
  AURORA_SPEAKER_THINKING_LEVEL: minimal
  AURORA_SPEAKER_MAX_TOKENS: "2048"
  ASR_PROVIDER: mimo
  MEMORY_EMBEDDING_ENABLED: "false"
  TTS_ENABLED: "true"
  TTS_WS_URL: wss://llm-errus8cw2pf66bx9.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference
  MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
  SEED_ENABLED: "false"
  COOKIE_SECURE: "false"
  DEPLOYMENT_ENVIRONMENT: kind-w3-showcase
  TRACING_SAMPLING_PROBABILITY: "1.0"
  OTLP_TRACING_ENABLED: "true"
  OTLP_TRACING_ENDPOINT: http://inner-cosmos-otel-collector:4318/v1/traces
  # Direct Spring property names are required because this showcase activates dev,postgres
  # rather than the production profile that maps the shorter aliases above.
  MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED: "true"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://inner-cosmos-otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_TRACING_PROPAGATION_PRODUCE: W3C
  MANAGEMENT_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_NAMESPACE: inner-cosmos
  MANAGEMENT_OPENTELEMETRY_RESOURCE_ATTRIBUTES_DEPLOYMENT_ENVIRONMENT: kind-w3-showcase
