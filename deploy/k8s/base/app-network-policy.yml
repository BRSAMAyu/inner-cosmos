apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inner-cosmos-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inner-cosmos
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        # Actuator's separate "management" port (application-academy-eks.yml's
        # management.server.port, deploy/k8s/base/app-deployment.yml's "management"
        # containerPort/probes). Not Service/HTTPRoute-mapped -- only kubelet probes and
        # in-cluster Prometheus reach it, both of which this policy has no way to distinguish
        # from any other in-cluster caller by port alone (same as the existing 8080 rule below,
        # which is equally unrestricted by source).
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - {protocol: TCP, port: 443}
