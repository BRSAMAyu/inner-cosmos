spring:
  profiles:
    active: test
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:innercosmos-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8

llm:
  mode: dev
  provider: mock
  allow-fallback: true

inner-cosmos:
  security:
    csrf-enabled: false
  demo:
    seed-enabled: true
  wake:
    # CP-26 服务端 vendor push 唤醒文案脱敏：与主 application.yml 同键同默认（测试 yml 会
    # 整体遮蔽主配置，这里镜像一份保证测试上下文与生产口径一致）。详见主配置内注释。
    push-sanitized: ${INNER_COSMOS_WAKE_PUSH_SANITIZED:true}
