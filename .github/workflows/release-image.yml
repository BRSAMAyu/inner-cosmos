name: Release signed OCI image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
      - name: Verify backend and executed-test baseline
        run: |
          ./mvnw -B clean verify
          pwsh ./scripts/assert-test-baseline.ps1 -MinimumTests 931
      - name: Verify frontend contract, tests and production build
        working-directory: web
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run acceptance:check
          pnpm run operations:test
          pnpm run operations:check
          pnpm run api:check
          pnpm run api:diff:test
          pnpm test
          pnpm run build
      - name: Verify Apache-2.0 release identity
        shell: bash
        run: |
          test -f LICENSE
          grep -Fq 'Apache License' LICENSE
          grep -Fq '"license": "Apache-2.0"' web/package.json
          grep -Fq '<name>Apache License, Version 2.0</name>' pom.xml
      - name: Verify secrets and Academy schema contract
        shell: pwsh
        run: |
          ./scripts/scan-secrets.ps1
          ./scripts/scan-secrets.ps1 -History
          ./scripts/academy/validate-schema-version.ps1

  build-sign:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve immutable release coordinates
        id: coordinates
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic v-prefixed version." >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Build and push digest-addressed image with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.coordinates.outputs.image }}:${{ steps.coordinates.outputs.tag }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Keyless-sign the immutable digest
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify release identity and signature
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify
          --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          "$IMAGE@$DIGEST"
      - name: Record immutable release evidence
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}
          TAG: ${{ steps.coordinates.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Signed OCI release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SBOM: attached by BuildKit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provenance: mode=max, bound to the signed image index" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release record for a pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.coordinates.outputs.image }}
          TAG: ${{ steps.coordinates.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Immutable release identity"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image tag: \`$IMAGE:$TAG\`"
            echo "- Image digest: \`$IMAGE@$DIGEST\`"
            echo "- Signature: keyless Cosign verification passed"
            echo "- Supply chain: BuildKit SBOM and max-mode provenance attached"
            echo "- License: Apache-2.0"
            echo
            echo "## Evidence boundary"
            echo
            echo "This release candidate is competition-ready machine evidence, not a claim that"
            echo "physical-device, independent usability, real AWS apply, legal/psychology review,"
            echo "or production operations human gates are complete. See the acceptance ledger."
          } > "$notes"

          args=(--verify-tag --title "Inner Cosmos $TAG" --notes-file "$notes")
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
